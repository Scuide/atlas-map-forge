name: windows-app

# Builds the one-file Windows program. Manual runs upload it as a workflow artifact;
# a version tag (v0.3.0 ...) also creates a draft GitHub release with the program attached.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pywebview pyinstaller
      - name: Pack
        run: pyinstaller -y packaging/atlasforge.spec
      - name: Self-test of the packed program (preview and a full map build)
        shell: pwsh
        run: |
          $env:ATLASFORGE_LOG = "$PWD\selftest.log"
          $p = Start-Process dist\AtlasMapForge.exe -ArgumentList "--selftest","--build" -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasMapForge-windows
          path: dist/AtlasMapForge.exe
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/AtlasMapForge.exe --draft --title "Atlas Map Forge ${{ github.ref_name }}" --notes "See CHANGELOG.md."
