name: windows-app

# Builds the one-file programs for Windows (AtlasMapForge.exe, app window) and Linux (AtlasMapForge, opens
# in the web browser). Manual runs upload them as workflow artifacts; a version tag (v0.3.0 ...) also creates
# a draft GitHub release with both attached.
# A manual run with "release_tag" set (e.g. v0.4.21) creates that tag on the built commit and publishes a
# GitHub release with both programs; notes come from docs/release-notes/<tag>.md. If the release already
# exists, the programs are uploaded to it (replacing files of the same name) and its notes are refreshed.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (empty = artifact only)"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[app]" pyinstaller
      - name: Pack
        run: pyinstaller -y packaging/atlasforge.spec
      - name: Self-test of the packed program (preview and a full map build)
        shell: pwsh
        run: |
          $env:ATLASFORGE_LOG = "$PWD\selftest.log"
          $p = Start-Process dist\AtlasMapForge.exe -ArgumentList "--selftest","--build" -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Window test (the real app window must stay responsive and show a preview)
        shell: pwsh
        run: |
          $env:APPDATA = "$PWD\appdata"
          New-Item -ItemType Directory -Force "$env:APPDATA\AtlasMapForge" | Out-Null
          '{"author": "CI"}' | Set-Content "$env:APPDATA\AtlasMapForge\config.json"
          $env:ATLASFORGE_LOG = "$PWD\gui.log"
          $p = Start-Process dist\AtlasMapForge.exe -PassThru
          $bad = 0; $seen = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            $wins = Get-Process AtlasMapForge -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 }
            if ($wins) { $seen = $true; if ($wins | Where-Object { -not $_.Responding }) { $bad++ } else { $bad = 0 } }
            if ($bad -ge 3) { Write-Host "window not responding"; break }
            if ((Test-Path gui.log) -and (Select-String -Path gui.log -Pattern "first preview shown" -Quiet)) { break }
          }
          Get-Process AtlasMapForge -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path gui.log) { Get-Content gui.log }
          $ok = (Test-Path gui.log) -and (Select-String -Path gui.log -Pattern "first preview shown" -Quiet)
          Write-Host "window seen: $seen, not responding polls: $bad, preview shown: $ok"
          if ($bad -ge 3 -or -not $ok) { exit 1 }
      - uses: actions/upload-artifact@v6
        with:
          name: AtlasMapForge-windows
          path: dist/AtlasMapForge.exe

  linux:
    runs-on: ubuntu-22.04            # glibc 2.35: runs on Ubuntu 22.04+, Debian 12+, Fedora 36+ and newer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . py7zr pyinstaller
      - name: Pack
        run: pyinstaller -y packaging/atlasforge.spec
      - name: Self-test of the packed program (preview and a full map build)
        run: |
          export ATLASFORGE_LOG="$PWD/selftest.log"
          ./dist/AtlasMapForge --selftest --build
      - name: Archive (keeps the executable bit)
        run: tar -C dist -czf AtlasMapForge-linux-x86_64.tar.gz AtlasMapForge
      - uses: actions/upload-artifact@v6
        with:
          name: AtlasMapForge-linux
          path: AtlasMapForge-linux-x86_64.tar.gz

  release:
    needs: [exe, linux]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - name: Draft release (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} out/AtlasMapForge.exe out/AtlasMapForge-linux-x86_64.tar.gz \
            --draft --title "Atlas Map Forge ${{ github.ref_name }}" --notes "See CHANGELOG.md."
      - name: Publish release (manual run with release_tag)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          files="out/AtlasMapForge.exe out/AtlasMapForge-linux-x86_64.tar.gz"
          notes="docs/release-notes/$TAG.md"
          [ -f "$notes" ] || notes=/dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            [ "$notes" = /dev/null ] || gh release edit "$TAG" --notes-file "$notes"
            exit 0
          fi
          pre=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then pre="--prerelease"; fi
          gh release create "$TAG" $files --target "$GITHUB_SHA" $pre \
            --title "Atlas Map Forge ${TAG#v}" --notes-file "$notes"
